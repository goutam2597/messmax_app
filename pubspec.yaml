name: messmax_app
description: "MessMax — universal mess meal counter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Networking
  dio: ^5.11.0

  # Logging
  logger: ^2.7.0

  # Secure storage
  flutter_secure_storage: ^11.0.0

  # Firebase — Google sign-in (same project pushtest-kd as web)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.2

  # SVG icons
  flutter_svg: ^2.3.0

  # Image picker
  image_picker: ^1.1.2

  # Carousel slider
  carousel_slider: ^5.1.2

  # Staggered grid
  flutter_staggered_grid_view: ^0.7.0

  # Fullscreen zoomable photo viewer
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
