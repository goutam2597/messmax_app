name: messmax_app
description: "MessMax — universal mess meal counter."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Networking
  dio: ^5.11.0

  # Logging
  logger: ^2.7.0

  # Secure storage
  flutter_secure_storage: ^11.0.0

  # Firebase — Google sign-in & Push Notifications (same project pushtest-kd as web)
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0

  # Local notifications (show FCM foreground messages as banners)
  flutter_local_notifications: ^22.3.0

  # SVG icons
  flutter_svg: ^2.3.0

  # Image picker
  image_picker: ^1.2.3

  # Carousel slider
  carousel_slider: ^5.1.2

  # Staggered grid
  flutter_staggered_grid_view: ^0.7.0

  # Fullscreen zoomable photo viewer
  photo_view: ^0.15.0
  google_sign_in: ^7.2.0

  # Environment configuration
  flutter_dotenv: ^6.0.1

  # URL Launcher for Phone & WhatsApp
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: LiAdorNoirrit
      fonts:
        - asset: assets/fonts/Li_Ador_Noirrit_Light.ttf
          weight: 300
        - asset: assets/fonts/Li_Ador_Noirrit_Regular.ttf
          weight: 400
        - asset: assets/fonts/Li_Ador_Noirrit_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Li_Ador_Noirrit_Bold.ttf
          weight: 700
        - asset: assets/fonts/Li_Ador_Noirrit_Italic.ttf
          style: italic
