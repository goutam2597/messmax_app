name: Play Release (AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (closed, internal, production)"
        required: false
        default: "closed"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get
        working-directory: messmax_app

      - name: Analyze
        run: flutter analyze
        working-directory: messmax_app

      # Uncomment when you have widget tests you trust in CI:
      # - name: Test
      #   run: flutter test
      #   working-directory: messmax_app

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > messmax_app/android/app/upload-keystore.jks
          ls -lh messmax_app/android/app/upload-keystore.jks

      - name: Build signed AAB
        run: |
          # pubspec is 1.0.3+5 and Play already has a closed-testing build.
          # Play rejects versionCode <= existing, and GITHUB_RUN_NUMBER
          # restarts at 1, so offset it to guarantee an increase.
          BUILD_NUMBER=$((5 + ${{ github.run_number }}))
          echo "Building with versionCode=$BUILD_NUMBER"
          flutter build appbundle --release --build-number=$BUILD_NUMBER
        working-directory: messmax_app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: app/upload-keystore.jks

      - name: Upload AAB artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ github.ref_name }}-${{ github.run_number }}
          path: messmax_app/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.messmax.net.app
          releaseFiles: messmax_app/build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'closed' }}
          status: completed
